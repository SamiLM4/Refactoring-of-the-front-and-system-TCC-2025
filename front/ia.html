<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico IA - MedInsight AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/modern.css">
    <style>
        .ia-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: start;
        }

        /* ===================== */
        /* Console de Processamento (somente log, altura fixa + scroll) */
        /* ===================== */
        .ia-right-card {
            height: 420px;
            display: flex;
            flex-direction: column;
        }

        .ia-right-card h3 {
            margin-bottom: 1rem;
            flex-shrink: 0;
        }

        .log-container {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 0.5rem;
            flex: 1;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.875rem;
            color: #10b981;
            box-sizing: border-box;
        }

        /* ===================== */
        /* Card de Resultado Atual (aparece após a análise, sem scroll) */
        /* ===================== */
        .resultado-atual-card {
            margin-top: 2rem;
            border-left: 4px solid var(--primary);
            animation: fadeIn 0.4s ease-out;
        }

        .resultado-atual-label {
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 1rem;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        #resultado-atual-text {
            line-height: 1.6;
            font-size: 0.875rem;
        }

        /* ===================== */
        /* Histórico de laudos (colapsável) */
        /* ===================== */
        .historico-card {
            margin-top: 2rem;
        }

        .laudo-item {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .laudo-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            cursor: pointer;
            user-select: none;
        }

        .laudo-item-header:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .laudo-item-header-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .laudo-toggle-icon {
            display: inline-block;
            transition: transform 0.25s ease;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .laudo-item.expanded .laudo-toggle-icon {
            transform: rotate(180deg);
        }

        .laudo-item-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .laudo-item-header-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .laudo-item-body {
            display: none;
            padding: 0 1rem 1rem 1rem;
            border-top: 1px solid var(--border-color);
        }

        .laudo-item.expanded .laudo-item-body {
            display: block;
            padding-top: 1rem;
        }

        .btn-excluir {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.25rem 0.75rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
        }

        .btn-excluir:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .imagens-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
            margin-top: 0.75rem;
        }

        .imagens-grid a img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 0.375rem;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: transform 0.2s;
        }

        .imagens-grid a img:hover {
            transform: scale(1.05);
        }

        .laudo-text {
            font-size: 0.875rem;
            line-height: 1.6;
            color: var(--text-muted);
        }

        .resultado-atual-card ul,
        .laudo-text ul {
            padding-left: 1.25rem;
            margin: 0.5rem 0;
        }

        .resultado-atual-card li,
        .laudo-text li {
            margin-bottom: 0.5rem;
        }

        .resultado-atual-card p,
        .laudo-text p {
            margin-bottom: 0.75rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo"
                style="font-size: 1.5rem; font-weight: 700; margin-bottom: 2.5rem; background: linear-gradient(135deg, #6366f1, #ec4899); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
                MedInsight AI
            </div>
            <nav id="menu" class="nav-menu"></nav>
            <div style="margin-top: auto; padding-top: 2rem; border-top: 1px solid var(--border-color);">
                <div id="userEmail" style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1rem;"></div>
                <button onclick="logout()" class="btn btn-primary" style="width: 100%;">Sair</button>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="main-content">
            <header style="margin-bottom: 2rem;">
                <h1 style="font-size: 1.875rem; font-weight: 700;">Diagnóstico com I.A.</h1>
                <p style="color: var(--text-muted);">Processamento avançado de prontuários em tempo real.</p>
            </header>

            <!-- Grid principal: formulário | console -->
            <div class="ia-grid">
                <!-- Coluna esquerda: formulário -->
                <div class="card">
                    <h3 style="margin-bottom: 1.5rem;">Novo Diagnóstico</h3>
                    <div style="margin-bottom: 1.5rem;">
                        <label
                            style="display: block; font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.5rem;">Selecionar
                            Paciente</label>
                        <select id="paciente-select" onchange="buscarDiagnostico()"
                            style="width: 100%; padding: 0.75rem; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 0.5rem; color: white;">
                            <option value="">Carregando pacientes...</option>
                        </select>
                    </div>
                    <div style="margin-bottom: 1.5rem;">
                        <label
                            style="display: block; font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.5rem;">Upload
                            do Exame (MRI)</label>
                        <input type="file" id="mri-file" multiple accept="image/png, image/jpeg, image/jpg"
                            style="width: 100%; padding: 0.75rem; background: rgba(0,0,0,0.2); border: 1px dashed var(--border-color); border-radius: 0.5rem; color: white;">
                    </div>
                    <button onclick="analisarIA()" id="btn-analisar" class="btn btn-primary"
                        style="width: 100%; padding: 1rem;">Iniciar Análise Neural</button>
                </div>

                <!-- Coluna direita: console de processamento (SOMENTE log) -->
                <div class="card ia-right-card">
                    <h3>Console de Processamento</h3>
                    <div id="log" class="log-container">
                        > Sistema pronto. Aguardando entrada...
                    </div>
                </div>
            </div>

            <!-- Resultado da análise ATUAL (aparece após concluir, aberto por completo) -->
            <div class="card resultado-atual-card" id="resultado-atual" style="display:none;">
                <div class="resultado-atual-label">RESULTADO DA ANÁLISE ATUAL</div>
                <div id="resultado-atual-text"></div>
            </div>

            <!-- Histórico de diagnósticos do paciente selecionado (itens colapsáveis) -->
            <div class="card historico-card" id="historico-section" style="display:none;">
                <h3 style="margin-bottom: 1.5rem;">Histórico de Laudos do Paciente</h3>
                <div id="historico-list"></div>
            </div>
        </main>
    </div>

    <script src="js/auth.js?v=3"></script>
    <script src="js/createPermissionChecker.js?v=3"></script>
    <script src="js/dashboard.js?v=3"></script>
    <script>
        // =====================
        // Carrega pacientes no select
        // =====================
        async function loadPacientes() {
            try {
                const res = await fetch(`${API_URL}/pacientes`, {
                    headers: { "Authorization": "Bearer " + token }
                });
                const data = await res.json();
                const select = document.getElementById('paciente-select');
                select.innerHTML = '<option value="">Selecione um paciente</option>' +
                    (data.dados || []).map(p => `<option value="${p.id}">${p.nome} (${p.cpf})</option>`).join('');
            } catch (e) {
                console.error('Erro ao carregar pacientes', e);
            }
        }

        // =====================
        // Busca laudos existentes quando seleciona um paciente
        // =====================
        async function buscarDiagnostico() {
            const pacienteId = document.getElementById('paciente-select').value;
            const section = document.getElementById('historico-section');

            if (!pacienteId) {
                section.style.display = 'none';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/pacientes/${pacienteId}/ia`, {
                    headers: { "Authorization": "Bearer " + token }
                });
                const data = await res.json();
                const laudos = data.dados || [];

                if (laudos.length === 0) {
                    section.style.display = 'none';
                    return;
                }

                section.style.display = 'block';
                renderHistorico(laudos);
            } catch (e) {
                console.error('Erro ao buscar diagnósticos', e);
            }
        }

        // =====================
        // Monta o HTML de uma grade de imagens (base64 ou caminho legado)
        // =====================
        function montarImagensHtml(imagensRaw) {
            let imagens = imagensRaw || [];
            if (typeof imagens === 'string') {
                try { imagens = JSON.parse(imagens); } catch (e) { imagens = []; }
            }
            if (!Array.isArray(imagens)) imagens = [];

            if (imagens.length === 0) return '';

            return `<div class="imagens-grid">` +
                imagens.map(img => {
                    if (typeof img === 'object' && img.data) {
                        const src = `data:${img.mime};base64,${img.data}`;
                        return `<a href="${src}" target="_blank"><img src="${src}" alt="MRI" loading="lazy"></a>`;
                    }
                    return `<a href="${API_URL}/imagens/${String(img).replace(/^\/?(imagens\/)?/, '')}" target="_blank">
                                <img src="${API_URL}/imagens/${String(img).replace(/^\/?(imagens\/)?/, '')}" alt="MRI" loading="lazy">
                            </a>`;
                }).join('') +
                `</div>`;
        }

        // =====================
        // Renderiza histórico de laudos (itens colapsáveis)
        // =====================
        function renderHistorico(laudos) {
            const container = document.getElementById('historico-list');
            container.innerHTML = '';

            laudos.forEach(laudo => {
                const imagens = laudo.imagem || laudo.imagens || [];
                const imagensHtml = montarImagensHtml(imagens);

                const div = document.createElement('div');
                div.className = 'laudo-item';
                div.innerHTML = `
                    <div class="laudo-item-header" onclick="toggleLaudoItem(this)">
                        <div class="laudo-item-header-left">
                            <span class="laudo-toggle-icon">▼</span>
                            <span class="laudo-item-date">📅 ${laudo.data_diagnostico || 'Data não informada'}</span>
                        </div>
                        <div class="laudo-item-header-right">
                            <button class="btn-excluir" onclick="event.stopPropagation(); excluirDiagnostico(${laudo.id}, this)">🗑 Excluir</button>
                        </div>
                    </div>
                    <div class="laudo-item-body">
                        <div class="laudo-text">${markdownParaHtml(laudo.diagnostico)}</div>
                        ${imagensHtml}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // =====================
        // Expande/colapsa um item do histórico
        // =====================
        function toggleLaudoItem(headerEl) {
            const item = headerEl.closest('.laudo-item');
            item.classList.toggle('expanded');
        }

        // =====================
        // Exclui um diagnóstico
        // =====================
        async function excluirDiagnostico(id, btn) {
            if (!confirm('Deseja realmente excluir este diagnóstico?')) return;

            try {
                btn.disabled = true;
                await fetch(`${API_URL}/ia/${id}`, {
                    method: 'DELETE',
                    headers: { "Authorization": "Bearer " + token }
                });
                // Recarrega o histórico do paciente
                await buscarDiagnostico();
            } catch (e) {
                console.error('Erro ao excluir diagnóstico', e);
                btn.disabled = false;
            }
        }

        // =====================
        // Adiciona linha no console de log
        // =====================
        function addLog(msg) {
            const log = document.getElementById('log');
            log.innerHTML += `<div>> ${msg}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        // =====================
        // Converte markdown simples (*, **) em HTML legível
        // =====================
        function markdownParaHtml(texto) {
            if (!texto) return '';
            const linhas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            let html = '';
            let dentroLista = false;

            linhas.forEach(linha => {
                const isItemLista = /^\*\s+/.test(linha);
                let conteudo = linha.replace(/^\*\s+/, '');
                conteudo = conteudo.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

                if (isItemLista) {
                    if (!dentroLista) { html += '<ul>'; dentroLista = true; }
                    html += `<li>${conteudo}</li>`;
                } else {
                    if (dentroLista) { html += '</ul>'; dentroLista = false; }
                    html += `<p>${conteudo}</p>`;
                }
            });
            if (dentroLista) html += '</ul>';
            return html;
        }

        // =====================
        // Gera novo diagnóstico via IA
        // =====================
        async function analisarIA() {
            const paciente = document.getElementById('paciente-select').value;
            const fileInput = document.getElementById('mri-file');
            const files = fileInput.files;

            if (!paciente || files.length === 0) {
                alert('Selecione um paciente e anexe pelo menos uma imagem de Ressonância Magnética.');
                return;
            }

            const btn = document.getElementById('btn-analisar');
            btn.disabled = true;
            btn.innerText = 'Processando...';

            const logEl = document.getElementById('log');
            const resultadoAtualEl = document.getElementById('resultado-atual');
            const resultadoAtualTextEl = document.getElementById('resultado-atual-text');

            // Reseta o console e esconde o resultado atual anterior
            resultadoAtualEl.style.display = 'none';
            resultadoAtualTextEl.innerHTML = '';
            logEl.innerHTML = '> Sistema pronto. Aguardando entrada...';
            addLog('Enviando arquivo do exame para o Serviço de IA Seguro...');

            const steps = [
                'Processando camadas da imagem MRI...',
                'Buscando padrões geométricos suspeitos...',
                'Verificando marcadores de desmielinização periventricular...',
                'Calculando percentual de probabilidade neural...',
                'Gerando laudo descritivo estruturado...'
            ];

            for (const step of steps) {
                await new Promise(r => setTimeout(r, 600));
                addLog(step);
            }

            try {
                const formData = new FormData();
                formData.append('paciente_id', paciente);
                // O backend espera $_FILES['imagens'] (no plural)
                formData.append('imagens', files);

                const res = await fetch(`${API_URL}/ia/analisar`, {
                    method: 'POST',
                    headers: { "Authorization": "Bearer " + token },
                    body: formData
                });

                const result = await res.json();

                if (!res.ok || !result.status) {
                    addLog('Erro: ' + (result.dados?.msg || 'Falha ao processar no servidor.'));
                    btn.disabled = false;
                    btn.innerText = 'Iniciar Análise Neural';
                    return;
                }

                const diagnostico = result.dados;
                const imagensHtml = montarImagensHtml(diagnostico.imagens);

                addLog('Análise concluída e registrada no banco de dados.');

                // Mostra o resultado atual em card próprio, aberto por completo
                resultadoAtualTextEl.innerHTML = `
                    ${markdownParaHtml(diagnostico.diagnostico)}
                    ${imagensHtml}
                `;
                resultadoAtualEl.style.display = 'block';

                // Atualiza o histórico automaticamente
                await buscarDiagnostico();

            } catch (e) {
                addLog('Erro ao processar análise no servidor.');
                console.error(e);
            }

            btn.disabled = false;
            btn.innerText = 'Iniciar Análise Neural';
        }

        loadPacientes();
    </script>
</body>

</html>
